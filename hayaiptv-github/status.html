<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>État du service — Haya IPTV</title>
  <meta name="description" content="État en temps réel des services Haya IPTV : site, streaming, replay, paiements, support.">
  <link rel="canonical" href="https://hayaiptv.com/status">
  <meta name="theme-color" content="#05070f">
  <script>try { const t = localStorage.getItem("haya-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css?v=9">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    .status-page { max-width: 820px; margin: 0 auto; padding: 120px 20px 60px; }
    .banner { display: flex; align-items: center; gap: 14px; padding: 20px 22px; border-radius: 18px; font-weight: 800; font-size: 1.15rem; margin: 20px 0; }
    .banner.ok { background: rgba(46,229,157,.12); border: 1px solid rgba(46,229,157,.4); color: var(--ok); }
    .banner.warn { background: rgba(255,181,71,.12); border: 1px solid rgba(255,181,71,.4); color: #ffb547; }
    .banner.down { background: rgba(255,59,92,.12); border: 1px solid rgba(255,59,92,.4); color: #ff6b88; }
    .comp { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
    .comp:last-child { border-bottom: 0; }
    .uptime { grid-column: 1 / -1; display: flex; gap: 2px; height: 26px; }
    .uptime i { flex: 1; border-radius: 3px; background: var(--ok); opacity: .85; }
    .uptime i.slow { background: #ffb547; } .uptime i.down { background: #ff3b5c; }
    .uptime-legend { grid-column: 1 / -1; display: flex; justify-content: space-between; font-size: .75rem; color: var(--muted); }
  </style>
</head>
<body>
<header class="top scrolled">
  <nav class="wrap nav" aria-label="Navigation principale">
    <a href="/" class="brand" aria-label="Haya IPTV — accueil"><img class="mark" src="logo.svg" alt="" width="38" height="38"><span class="word">haya<b>iptv</b></span></a>
    <div class="nav-cta"><button type="button" class="theme-btn" id="theme-btn">☀️</button><a class="btn small ghost" href="/">← Retour au site</a></div>
  </nav>
</header>
<main class="status-page">
  <span class="eyebrow">Transparence</span>
  <h1 style="font-size:clamp(2rem,5vw,2.8rem);margin:10px 0 0">État du service</h1>
  <div id="banner"></div>
  <div class="panel" id="components" style="padding:0"></div>
  <p class="muted" style="font-size:.85rem;margin-top:14px" id="updated"></p>
</main>
<script src="data.js?v=9"></script>
<script>
  const data = hayaLoad(), s = data.status;
  hayaApplyTheme(data.theme);
  hayaThemeButton(document.getElementById("theme-btn"));
  const LABEL = { ok: "✅ Opérationnel", slow: "🟡 Ralentissements", down: "🔴 Panne", maint: "🔧 Maintenance" };
  const worst = s.components.some(c => c.state === "down") ? "down" : s.components.some(c => c.state !== "ok") ? "warn" : "ok";
  document.getElementById("banner").innerHTML = `<div class="banner ${worst}">${worst === "ok" ? "✅ Tous les services fonctionnent normalement" : worst === "down" ? "🔴 Incident en cours sur certains services" : "🟡 Certains services sont perturbés"}</div>
    ${s.message ? `<div class="panel" style="margin-bottom:20px"><b>ℹ️ Information</b><p style="margin:6px 0 0">${esc(s.message)}</p></div>` : ""}`;
  // Historique de disponibilité sur 90 jours (démonstration, généré de façon déterministe)
  const hist = (seed) => [...Array(90)].map((_, i) => { const x = Math.sin(seed * 999 + i * 77.7) * 10000 % 1; return Math.abs(x) > .985 ? "down" : Math.abs(x) > .955 ? "slow" : ""; });
  document.getElementById("components").innerHTML = s.components.map((c, k) => {
    const h = hist(k + 1), up = (100 - h.filter(x => x === "down").length * .3 - h.filter(x => x === "slow").length * .05).toFixed(2);
    return `<div class="comp"><b>${esc(c.name)}</b><span>${LABEL[c.state] || LABEL.ok}</span>
      <div class="uptime" aria-label="Disponibilité sur 90 jours">${h.map(x => `<i class="${x}"></i>`).join("")}</div>
      <div class="uptime-legend"><span>il y a 90 jours</span><span>${up} % de disponibilité</span><span>aujourd'hui</span></div></div>`;
  }).join("");
  document.getElementById("updated").textContent = "Dernière mise à jour : " + new Date(s.updated || Date.now()).toLocaleString("fr-FR") + " · historique indicatif";
</script>
</body>
</html>
